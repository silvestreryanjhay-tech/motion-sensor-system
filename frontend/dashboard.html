<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion Sensor Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard">
        <header>
            <h1>🔴 Motion Sensor & Camera System</h1>
            <div class="status-indicator">
                <span id="systemStatus" class="status-active">● System Active</span>
                <button id="toggleSystem">Toggle System</button>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Motion Events Today</h3>
                <p id="totalEvents">0</p>
            </div>
            <div class="stat-card">
                <h3>Status</h3>
                <p id="motionStatus">No Motion</p>
                <div id="motionIndicator" class="indicator-green"></div>
            </div>
            <div class="stat-card">
                <h3>Last Detection</h3>
                <p id="lastDetection">Never</p>
            </div>
            <div class="stat-card">
                <h3>Buzzer</h3>
                <p id="buzzerStatus">Inactive</p>
                <div id="buzzerIndicator" class="indicator-green"></div>
            </div>
        </div>

        <div class="dashboard-row">
            <div class="chart-container">
                <h2>Motion Events (Last 24 Hours)</h2>
                <canvas id="motionChart"></canvas>
            </div>
            
            <div class="live-feed">
                <h2>Live Status</h2>
                <div id="liveStatus">
                    <p>Camera: <span id="cameraStatus">Standby</span></p>
                    <p>Motion Sensor: <span id="sensorStatus">Active</span></p>
                </div>
                <div class="control-buttons">
                    <button id="captureManual">📸 Capture Image</button>
                    <button id="recordManual">🎥 Record Video</button>
                </div>
            </div>
        </div>

        <div class="events-section">
            <h2>Recent Events</h2>
            <div id="eventsList" class="events-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
